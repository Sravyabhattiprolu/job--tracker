<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Job Opportunities | Job Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <nav class="navbar">
    <a href="tracker.html">📊 Dashboard</a>
    <a href="jobs.html">🔎 Find Jobs</a>
    <a href="applications.html">📁 My Applications</a>
    <button id="logout-button">Logout</button>
  </nav>

  <main class="jobs-page">
    <section class="jobs-heading">
      <div>
        <p class="eyebrow">LIVE OPPORTUNITIES</p>
        <h1>Find your next role</h1>
        <p>Search real remote jobs from companies around the world.</p>
      </div>

      <button id="refresh-jobs" class="refresh-button">↻ Refresh jobs</button>
    </section>

    <section class="job-filters">
      <input id="job-search" type="search" placeholder="Search role, skill, or company">

      <select id="experience-filter">
        <option value="all">All experience levels</option>
        <option value="fresher">Fresher / Entry level</option>
        <option value="experienced">Experienced</option>
      </select>
    </section>

    <p id="job-message" class="job-message">Loading current job opportunities…</p>

    <section id="jobs-list" class="jobs-list"></section>

    <p class="source-note">
      Live listings provided by
      <a href="https://remotive.com/" target="_blank">Remotive</a>.
      Always read the original listing before applying.
    </p>
  </main>

  <script src="js/app.js"></script>
  <script src="js/jobs.js"></script>
</body>
</html>
