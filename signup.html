<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Job Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">
  <main class="login-card">
    <div class="login-icon">✨</div>

    <h1>Create Account</h1>
    <p class="login-text">Start tracking your internship and job applications.</p>

    <form id="signup-form">
      <label for="signup-name">Full name</label>
      <input id="signup-name" type="text" placeholder="Example: Sravya" required>

      <label for="signup-email">Email address</label>
      <input id="signup-email" type="email" placeholder="example@email.com" required>

      <label for="signup-password">Create password</label>
      <input id="signup-password" type="password" placeholder="Minimum 6 characters" required>

      <button type="submit">Create Account →</button>
    </form>

    <p class="create-account">
      Already have an account?
      <a href="index.html">Sign In</a>
    </p>
  </main>

  <script src="js/signup.js"></script>
</body>
</html>
