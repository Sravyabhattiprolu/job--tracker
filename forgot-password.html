<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Job Tracker</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">
  <main class="login-card">
    <div class="login-icon">🔑</div>

    <h1>Reset Password</h1>
    <p class="login-text">Enter your email and choose a new password.</p>

    <form id="reset-form">
      <label for="reset-email">Email address</label>
      <input id="reset-email" type="email" placeholder="example@email.com" required>

      <label for="new-password">New password</label>
      <input id="new-password" type="password" placeholder="Minimum 6 characters" required>

      <button type="submit">Reset Password</button>
    </form>

    <p class="create-account">
      <a href="index.html">← Back to Sign In</a>
    </p>
  </main>

  <script src="js/reset-password.js"></script>
</body>
</html>
